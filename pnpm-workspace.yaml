overrides:
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  # One sharp for the whole tree. The build scripts use sharp directly to
  # squeeze the pre-rendered PNGs in public/, and adding it as a devDependency
  # also made next's own optional sharp@0.34.5 resolvable for the first time —
  # at which point next/og stopped using its bundled resvg encoder, picked up
  # 0.34.5 instead, and every ImageResponse render died with
  # "colourspace: parameter space not set" out of libvips. Pinning every copy
  # to one version @vercel/og is happy with removes the ambiguity. Bump this
  # together with the sharp devDependency.
  sharp: 0.35.5

# Off: this project tracks the newest release of everything, the day it ships.
# pnpm 11+ defaults to a 1-day quarantine (1440 minutes) that refuses any
# version younger than that — it resolved eslint, wrangler and lucide-react a
# release back, and failed `pnpm install --frozen-lockfile` in CI on a lockfile
# upgraded the same day.
minimumReleaseAge: 0

# Every dependency with an install script is named here, because pnpm 11+
# fails the install on one it has not been told about. The PostHog CLI's
# postinstall downloads the native binary the sourcemap upload shells out to at
# build time, and workerd's fetches the runtime wrangler dev and deploy run on.
# The other three were never run and nothing missed them: esbuild and
# unrs-resolver find their platform binary through optionalDependencies, and
# core-js only prints a banner.
allowBuilds:
  "@posthog/cli": true
  workerd: true
  core-js: false
  esbuild: false
  unrs-resolver: false

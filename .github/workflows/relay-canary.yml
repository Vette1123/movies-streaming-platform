# Is the Reely Player able to play? Hourly, read-only.
#
# The player streams through a provider whose gate has changed five times since
# September; every time, the first alarm was a person pressing play. This walks
# site -> player -> relay -> provider -> segment (scripts/relay-canary.mjs) and:
#   - on failure: opens ONE issue labelled `relay-down` (GitHub notifies the
#     repo owner) and fails the run;
#   - on recovery: closes it with the passing report.
# It spends no free title and needs no secrets.
name: Relay canary

on:
  schedule:
    # Off the hour, so it does not land with every other scheduled job.
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: relay-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPORT_FILE: report.md
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - id: canary
        continue-on-error: true
        run: node scripts/relay-canary.mjs

      - name: Open the outage issue
        if: steps.canary.outcome == 'failure'
        run: |
          gh label create relay-down --color B60205 --description 'Reely Player cannot play' --force
          open=$(gh issue list --state open --label relay-down --json number --jq '.[0].number')
          if [ -z "$open" ]; then
            [ -s report.md ] || echo 'The canary crashed before writing a report; see the run log.' > report.md
            printf '\n\nRun: %s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> report.md
            gh issue create --title 'Reely Player cannot play (relay canary)' --label relay-down --body-file report.md
          else
            echo "Issue #$open already open; not adding noise."
          fi
          exit 1

      - name: Close the outage issue
        if: steps.canary.outcome == 'success'
        run: |
          for n in $(gh issue list --state open --label relay-down --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Recovered.

          $(cat report.md)"
          done

name: Deploy

on:
  push:
    branches: [main] # deploy on every push to main (single source of truth)
  schedule:
    # Every 6h. Deploy cadence is the ONLY freshness control on this site: every
    # page is a build-time snapshot, nothing revalidates on demand, so whatever
    # interval is set here is exactly how stale the content can get.
    #
    # It ran at 2x/day on the reasoning that the TMDB lists behind these pages
    # "barely move within a day". Half true, and the wrong half was load-bearing:
    # the hero was reading `trending/all/week`, a 7-day rolling window that really
    # does sit still for weeks — so redeploying changed nothing visible and the
    # cadence looked irrelevant. The hero is on `trending/all/day` now
    # (services/movies.ts), which turns over daily, so the interval finally buys
    # something. 6h is where it stops paying: TMDB's daily window is recomputed
    # on its own schedule, and building 8x/day would mostly re-fetch identical
    # lists.
    #
    # The two costs that argued for a longer interval are both settled. Chunk-hash
    # rotation no longer strands anyone — the SW is build-id stamped and an
    # installed PWA reloads itself on the next foreground (components/pwa/
    # service-worker-register.tsx). And deploy frequency has never affected the
    # Worker CPU-kill rate: kills were cold renders of detail pages outside the
    # prerender set, which a redeploy does not add. Actions minutes are free on a
    # public repo, and a run is ~2.5min.
    #
    # NOTE: cron is UTC. Egypt = UTC+2 (winter) / UTC+3 (summer DST, late-Apr→late-Oct),
    # so local times below shift +1h in summer. GitHub also delays scheduled runs a
    # few min-to-30min under load (and rarely skips one) — exact-minute firing isn't guaranteed.
    - cron: '0 0 * * *' # 02:00 winter / 03:00 summer Egypt — overnight refresh
    - cron: '0 6 * * *' # 08:00 winter / 09:00 summer Egypt — morning refresh
    - cron: '0 12 * * *' # 14:00 winter / 15:00 summer Egypt — midday refresh
    - cron: '0 18 * * *' # 20:00 winter / 21:00 summer Egypt — evening refresh
  workflow_dispatch:

# Least privilege: the job only reads the repo (checkout). Everything that
# mutates Cloudflare/PostHog authenticates with its own token/secret, not the
# GITHUB_TOKEN — so drop that token to read-only.
permissions:
  contents: read

# Serialize deploys: if a push and a scheduled run (or two quick pushes) overlap,
# cancel the older in-flight run so only ONE build + KV populate happens.
concurrency:
  group: deploy-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # A full build + deploy + waf + smoke was ~3-5 min at ~1,100 prerendered
    # detail pages, and ~4 min at 1,921 routes (52s of that generating pages).
    # The 2026-08-03 widening in lib/media-page.ts roughly doubles both, so 30
    # keeps the same margin. Caps a hung wrangler/curl instead of the 6h
    # default — raise this, don't shrink the prerender set, if a build ever
    # brushes it.
    timeout-minutes: 30
    # Single toggle for the IMDb ratings feature. 'false' (default) skips the
    # shard build + upload entirely — no ~10MB dataset download, no 256 dead
    # /imdb-ratings/*.json assets shipped to the Worker — and leaves the app on
    # TMDB ratings. Flip to 'true' to re-enable end to end (build, ship, and the
    # runtime read in services/imdb.ts). Must match NEXT_PUBLIC_IMDB_RATINGS there.
    env:
      NEXT_PUBLIC_IMDB_RATINGS: 'false'
    steps:
      - uses: actions/checkout@v7
        # This job never pushes to git — everything mutates Cloudflare/PostHog
        # with its own token. Don't leave the GITHUB_TOKEN in .git/config.
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # IMDb's Non-Commercial dataset refreshes once a day, but this workflow
      # deploys on every push plus twice on a schedule. Cache the generated
      # rating shards keyed by UTC date so only the FIRST deploy each day
      # downloads + shards the ~10MB dataset (~3s); the rest restore it
      # instantly. Cache miss (incl. the first run of a new day) regenerates.
      # Fails soft — a download hiccup just leaves the app on TMDB ratings.
      - name: Compute UTC date
        id: today
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Cache IMDb rating shards (daily)
        id: imdb-cache
        if: env.NEXT_PUBLIC_IMDB_RATINGS == 'true'
        uses: actions/cache@v6
        with:
          path: public/imdb-ratings
          key: imdb-ratings-${{ steps.today.outputs.day }}

      - name: Build IMDb rating shards
        if: env.NEXT_PUBLIC_IMDB_RATINGS == 'true' && steps.imdb-cache.outputs.cache-hit != 'true'
        run: pnpm imdb:ratings

      # Manual-only: Cloudflare secrets persist across deploys, so re-putting them
      # on every push/cron is redundant and bumps an extra Worker version each run.
      # Run this once via "Run workflow" after rotating a key or recreating the
      # Worker; normal push/scheduled deploys reuse the already-stored secrets.
      # `printf %s` (not `echo`) so no trailing newline is baked into the secret
      # value — a stray \n in TMDB_HEADER_KEY would corrupt the Authorization
      # header. Secrets come in via env, never interpolated into the shell body.
      - name: Upload Worker secrets
        if: github.event_name == 'workflow_dispatch'
        run: |
          printf '%s' "$TMDB_API_KEY" | pnpm wrangler secret put TMDB_API_KEY
          printf '%s' "$TMDB_HEADER_KEY" | pnpm wrangler secret put TMDB_HEADER_KEY
          printf '%s' "$SESSION_TOKEN_SECRET" | pnpm wrangler secret put SESSION_TOKEN_SECRET
          printf '%s' "$GOOGLE_CLIENT_ID" | pnpm wrangler secret put GOOGLE_CLIENT_ID
          printf '%s' "$GOOGLE_CLIENT_SECRET" | pnpm wrangler secret put GOOGLE_CLIENT_SECRET
          printf '%s' "$BMC_WEBHOOK_SECRET" | pnpm wrangler secret put BMC_WEBHOOK_SECRET
          printf '%s' "$VAPID_PUBLIC_KEY" | pnpm wrangler secret put VAPID_PUBLIC_KEY
          printf '%s' "$VAPID_PRIVATE_KEY" | pnpm wrangler secret put VAPID_PRIVATE_KEY
          printf '%s' "$VAPID_SUBJECT" | pnpm wrangler secret put VAPID_SUBJECT
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_HEADER_KEY: ${{ secrets.TMDB_HEADER_KEY }}
          # Accounts + push. Rotating any of these is the same one dispatch as
          # rotating a TMDB key; sign-in breaks for existing sessions when
          # SESSION_TOKEN_SECRET changes, which is the point of rotating it.
          SESSION_TOKEN_SECRET: ${{ secrets.SESSION_TOKEN_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          BMC_WEBHOOK_SECRET: ${{ secrets.BMC_WEBHOOK_SECRET }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}

      - run: pnpm run deploy:full
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_HEADER_KEY: ${{ secrets.TMDB_HEADER_KEY }}
          NEXT_PUBLIC_TMDB_BASEURL: ${{ secrets.NEXT_PUBLIC_TMDB_BASEURL }}
          NEXT_PUBLIC_BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL }}
          NEXT_PUBLIC_STREAMING_MOVIES_API_URL: ${{ secrets.NEXT_PUBLIC_STREAMING_MOVIES_API_URL }}
          # The embed slots (config/sources.ts). Secrets rather than repo
          # constants: this repository is public, and a checked-in list of
          # embed hosts is both a maintenance trap and free advertising for
          # somebody else's ad revenue. Absent/empty, a slot simply does not
          # exist — so a missing secret degrades rather than breaks.
          #
          # EVERY slot var must be forwarded here or the slot silently vanishes
          # from prod: Turbopack only inlines env vars that exist at build time,
          # leaving the rest as runtime lookups that are always undefined in the
          # browser (2026-08-23: Server 4's secrets were added to GitHub but not
          # mapped here, and an empty "bake it" rebuild could never bake them).
          NEXT_PUBLIC_STREAMING_MOVIES_API_LABEL: ${{ secrets.NEXT_PUBLIC_STREAMING_MOVIES_API_LABEL }}
          NEXT_PUBLIC_STREAM_SOURCE_2: ${{ secrets.NEXT_PUBLIC_STREAM_SOURCE_2 }}
          NEXT_PUBLIC_STREAM_SOURCE_2_LABEL: ${{ secrets.NEXT_PUBLIC_STREAM_SOURCE_2_LABEL }}
          NEXT_PUBLIC_STREAM_SOURCE_3: ${{ secrets.NEXT_PUBLIC_STREAM_SOURCE_3 }}
          NEXT_PUBLIC_STREAM_SOURCE_3_LABEL: ${{ secrets.NEXT_PUBLIC_STREAM_SOURCE_3_LABEL }}
          NEXT_PUBLIC_STREAM_SOURCE_4: ${{ secrets.NEXT_PUBLIC_STREAM_SOURCE_4 }}
          NEXT_PUBLIC_STREAM_SOURCE_4_LABEL: ${{ secrets.NEXT_PUBLIC_STREAM_SOURCE_4_LABEL }}
          NEXT_PUBLIC_STREAM_SOURCE_4_MOVIE_PATH: ${{ secrets.NEXT_PUBLIC_STREAM_SOURCE_4_MOVIE_PATH }}
          NEXT_PUBLIC_STREAM_SOURCE_4_TV_PATH: ${{ secrets.NEXT_PUBLIC_STREAM_SOURCE_4_TV_PATH }}
          NEXT_PUBLIC_STREAM_SOURCE_5: ${{ secrets.NEXT_PUBLIC_STREAM_SOURCE_5 }}
          NEXT_PUBLIC_STREAM_SOURCE_5_LABEL: ${{ secrets.NEXT_PUBLIC_STREAM_SOURCE_5_LABEL }}
          NEXT_PUBLIC_STREAM_SOURCE_5_MOVIE_PATH: ${{ secrets.NEXT_PUBLIC_STREAM_SOURCE_5_MOVIE_PATH }}
          NEXT_PUBLIC_STREAM_SOURCE_5_TV_PATH: ${{ secrets.NEXT_PUBLIC_STREAM_SOURCE_5_TV_PATH }}
          # Optional per-slot query strings + which slot is the public default.
          NEXT_PUBLIC_STREAM_DEFAULT_SLOT: ${{ secrets.NEXT_PUBLIC_STREAM_DEFAULT_SLOT }}
          NEXT_PUBLIC_STREAMING_MOVIES_API_QUERY: ${{ secrets.NEXT_PUBLIC_STREAMING_MOVIES_API_QUERY }}
          NEXT_PUBLIC_STREAM_SOURCE_2_QUERY: ${{ secrets.NEXT_PUBLIC_STREAM_SOURCE_2_QUERY }}
          NEXT_PUBLIC_STREAM_SOURCE_3_QUERY: ${{ secrets.NEXT_PUBLIC_STREAM_SOURCE_3_QUERY }}
          NEXT_PUBLIC_STREAM_SOURCE_4_QUERY: ${{ secrets.NEXT_PUBLIC_STREAM_SOURCE_4_QUERY }}
          NEXT_PUBLIC_STREAM_SOURCE_5_QUERY: ${{ secrets.NEXT_PUBLIC_STREAM_SOURCE_5_QUERY }}
          # Optional search-engine verification meta tags (layout.tsx) — absent,
          # the tags simply don't render.
          NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ secrets.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}
          NEXT_PUBLIC_YANDEX_VERIFICATION: ${{ secrets.NEXT_PUBLIC_YANDEX_VERIFICATION }}
          NEXT_PUBLIC_BING_VERIFICATION: ${{ secrets.NEXT_PUBLIC_BING_VERIFICATION }}
          # Stamp PostHog events with the exact deploy (lib/person.ts), so an
          # anomaly can be pinned to the release that introduced it.
          NEXT_PUBLIC_APP_VERSION: ${{ github.sha }}
          # The supporters-only opt-in for OUR player. Needs the playback
          # worker + gado-proxy tier live, or the toggle only advertises.
          NEXT_PUBLIC_PRO_TRIAL_SELFHOST: ${{ secrets.NEXT_PUBLIC_PRO_TRIAL_SELFHOST }}
          NEXT_PUBLIC_SEARCH_ACTOR_GOOGLE: ${{ secrets.NEXT_PUBLIC_SEARCH_ACTOR_GOOGLE }}
          NEXT_PUBLIC_IMAGE_CACHE_HOST_URL: ${{ secrets.NEXT_PUBLIC_IMAGE_CACHE_HOST_URL }}
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
          NEXT_PUBLIC_IMDB_RATINGS: ${{ env.NEXT_PUBLIC_IMDB_RATINGS }}
          # The push subscribe call needs the VAPID public key in the browser
          # bundle, and NEXT_PUBLIC_* is inlined at build time — missing here it
          # is simply absent in prod, and the alerts panel reports "this browser
          # cannot receive notifications" on browsers that perfectly well can.
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
          # Personal API key → build-time sourcemap upload (withPostHogConfig in
          # next.config.mjs). The ONLY new secret to add. projectId (216915) and
          # API host (https://eu.posthog.com) default in next.config.mjs; if the
          # build ever skips upload, this secret is missing/empty (upload is gated
          # on it, so the deploy still succeeds without it).
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}

      # Re-apply the edge-cache + WAF rules on every deploy so they can't silently
      # drift off (they were never wired in before, so prod ran with NO edge cache
      # — every request hit the Worker and burned the free-plan 10ms CPU budget).
      # Idempotent: rules are keyed by the "[reely-waf]" description prefix and
      # replaced in place. Runs AFTER deploy so a WAF failure never blocks the
      # Worker rollout. REQUIRES the token to carry Zone.Cache Rules +
      # Zone.Transform Rules + Zone WAF: Edit — if it lacks them this step fails
      # loudly (that's the point: a red step here means the cache rule isn't live).
      #
      # WAF_PERMISSIVE is read from a repository VARIABLE, not hard-coded. Set it
      # to 1 (Settings → Secrets and variables → Actions → Variables) to hold the
      # zone open — for an OAuth brand review, or any other automated reviewer
      # that a managed challenge would show a challenge page instead of the site.
      # It used to be a local-only env var, which meant a permissive run from a
      # laptop was silently reverted by the very next push, with nothing on
      # screen to say the posture had changed. Unset is the hardened default, so
      # forgetting the variable can only ever leave the zone MORE protected.
      - name: Apply Cloudflare cache + WAF rules
        run: pnpm run waf:apply
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_NAME: reely.space
          WAF_PERMISSIVE: ${{ vars.WAF_PERMISSIVE }}

      # Post-deploy smoke test = our 5xx alert. Curl the critical routes and FAIL
      # the job (→ GitHub emails on the red run) if any returns a 5xx. This is what
      # catches a regression like the homepage 500 ("Too many subrequests by single
      # Worker invocation") seconds after rollout instead of from user reports.
      # Browser UA clears the WAF scraper challenge (empty-UA → managed challenge).
      # A short retry absorbs the first-hit cold render / edge-cache warm-up.
      - name: Smoke test (fail on 5xx)
        run: |
          # GitHub's default shell is `bash -eo pipefail`; disable errexit so a
          # transient curl failure (exit≠0) can't abort the step before the
          # numeric 5xx/000 checks below decide pass/fail.
          set +e
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
          BASE='https://www.reely.space'
          # /imdb-ratings/0.json intentionally omitted — the shards ship only when
          # NEXT_PUBLIC_IMDB_RATINGS is 'true'; re-add it here if you flip that on.
          PATHS='/ /movies /tv-shows /movies/550'
          fail=0
          for p in $PATHS; do
            code=0
            for attempt in 1 2 3; do
              code=$(curl -s -o /dev/null -w '%{http_code}' -A "$UA" --max-time 20 "$BASE$p")
              # 2xx/3xx/4xx are fine here; only a 5xx (or curl failure = 000) is a deploy failure.
              if [ "$code" -lt 500 ] && [ "$code" != "000" ]; then break; fi
              echo "  $p -> $code (attempt $attempt), retrying…"; sleep 5
            done
            if [ "$code" -ge 500 ] || [ "$code" = "000" ]; then
              echo "::error::Smoke test FAILED: $BASE$p returned $code"
              fail=1
            else
              echo "OK  $p -> $code"
            fi
          done
          exit $fail
